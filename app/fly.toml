# CALIBR on Fly.io — Johannesburg region, Turso-backed (no volume needed).
# Deploy:  cd app  →  fly launch --no-deploy --copy-config --name calibr  →  set secrets (below)  →  fly deploy
app = "calibr"
primary_region = "jnb"          # Johannesburg — lowest latency for SA users

[build]

[env]
  PORT = "8080"
  NODE_ENV = "production"
  ADMIN_EMAILS = "kreativethinkinghub@gmail.com"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep ONE machine always on: the local Turso replica stays warm and consistent (no cold-start re-sync).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "get"
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
